.tab{padding:9px 14px;font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s;font-family:'Cairo',sans-serif;display:flex;align-items:center;gap:5px}

.tab.active{color:var(--gold);border-bottom-color:var(--gold)}

.sec{display:none}

.dot{width:7px;height:7px;border-radius:50%}

.warn-c{background:var(--amber)}
.bad-c{background:var(--red)}
.twrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}

tbody tr{border-bottom:1px solid var(--border);transition:background .1s}

tbody tr.rWarn{background:var(--row-warn)}
tbody tr.rBad{background:var(--row-bad)}

tbody tr.rWarn td:first-child{border-right:3px solid var(--amber)}
tbody tr.rBad td:first-child{border-right:3px solid var(--red)}

td.nm{font-weight:900;color:var(--text)}
td.miss{color:var(--red);font-size:11px;font-weight:700}
td.nc{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text3);font-size:11px;font-weight:600}
.pbadge{background:var(--bg4);border:1px solid var(--border2);color:var(--gold2);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:900;white-space:nowrap}

function sc(s){return s==='ok'?'rOk':s==='bad'?'rBad':'rWarn'}
function mv(x){const b=!x||x==='?'||x==='';return b?'<span class="miss">—</span>':x}
function mp(x){const b=!x||x==='?'||x==='';return b?'<span class="miss">—</span>':`<span class="pbadge">${x}</span>`}

function buildRows(key){
  const s=SCH[key],r=DATA[key];
  if(!r.length)return`<tr><td colspan="20" style="text-align:center;padding:30px;color:var(--text3)">لا توجد بيانات</td></tr>`;
  return r.map((row,i)=>{
    const dk=`d_${key}_${i}`,ck=localStorage.getItem(dk)==='1';
    const cells=s.fields.map(f=>{
      const v=row[f.k],b=!v||v==='?'||v==='';
      if(f.k==='price'||f.k==='rent'||f.k==='budget')return`<td class="nm">${mp(v)}</td>`;
      if(f.t==='ta'||f.k==='note')return`<td class="nc" title="${v||''}">${v||'—'}</td>`;
      return`<td>${mv(v)}</td>`;
    }).join('');
    return`<tr class="${sc(row.st)}"><td style="color:var(--text3);font-weight:700;font-size:11px">${i+1}</td>${cells}<td><button class="donebtn ${ck?'ck':''}" onclick="td2('${key}',${i},this)">✓</button></td><td><div class="acell"><button class="ibtn" onclick="oEd('${key}',${i})" title="تعديل">✏</button><button class="ibtn dl" onclick="dR('${key}',${i})" title="حذف">✕</button></div></td></tr>`;
  }).join('');
}

function renderSec(ki){
  const key=KEYS[ki];
  const s=SCH[key];
  document.getElementById('sec'+ki).innerHTML=`
    <div class="toolbar">
      <input class="sinput" placeholder="🔍 ابحث في أي حقل..." oninput="fRows(${ki},this.value)">
      <input class="sinput" placeholder="🏘 فلتر بالمنطقة..." oninput="fArea(${ki},this.value)" style="max-width:160px">
      <input class="sinput" placeholder="💰 فلتر بالسعر..." oninput="fPrice(${ki},this.value)" style="max-width:130px">
      <button class="btn-add" onclick="oAdd(${ki})">+ إضافة</button>
    </div>
    <div class="twrap"><table><thead><tr>${s.cols.map(c=>`<th>${c}</th>`).join('')}<th>⚙</th></tr></thead><tbody id="tb${ki}">${buildRows(key)}</tbody></table></div>`;
}

function td2(key,i,el){const k=`d_${key}_${i}`,w=localStorage.getItem(k)==='1';localStorage.setItem(k,w?'0':'1');el.className='donebtn '+(w?'':'ck')}
function fRows(ki,q){document.querySelectorAll(`#tb${ki} tr`).forEach(r=>{r.classList.toggle('hid',!!q&&!r.textContent.toLowerCase().includes(q.toLowerCase()))})}
function fArea(ki,q){
  const key=KEYS[ki];
  document.querySelectorAll(`#tb${ki} tr`).forEach((r,i)=>{
    if(!q){r.classList.remove('hid');return;}
    const d=DATA[key][i];
    const areaVal=(d?(d.area||d.loc||''):'').toLowerCase();
    r.classList.toggle('hid',!areaVal.includes(q.toLowerCase()));
  });
}
function fPrice(ki,q){
  const key=KEYS[ki];
  document.querySelectorAll(`#tb${ki} tr`).forEach((r,i)=>{
    if(!q){r.classList.remove('hid');return;}
    const d=DATA[key][i];
    const pv=(d?(d.price||d.rent||d.budget||''):'').toString();
    const num=parseFloat(pv.replace(/[^\d.]/g,''));
    const qn=parseFloat(q);
    if(isNaN(num)||isNaN(qn)){r.classList.toggle('hid',!pv.includes(q));return;}
    r.classList.toggle('hid',Math.abs(num-qn)>qn*0.2);
  });
}
function sw(i,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));el.classList.add('active');document.getElementById('sec'+i).classList.add('active')}
function updateStats(){KEYS.forEach((k,i)=>{const n=DATA[k].length;document.getElementById('s'+i).textContent=n;document.getElementById('b'+i).textContent=n})}
function oAdd(ki){editIdx=-1;editKey=KEYS[ki];document.getElementById('mtitle').textContent='+ إضافة '+SCH[editKey].title;bForm(editKey,null);document.getElementById('mb').classList.add('op')}
function oEd(key,i){editIdx=i;editKey=key;document.getElementById('mtitle').textContent='✏ تعديل '+SCH[key].title;bForm(key,DATA[key][i]);document.getElementById('mb').classList.add('op')}
function bForm(key,d){
  const s=SCH[key];
  let h='<div class="fgrid">';
  s.fields.forEach(f=>{
    const v=d?d[f.k]||'':'';const r=f.req?'*':'';
    if(f.t==='ta'){h+=`<div class="fg full"><label>${f.l}${r}</label><textarea id="f_${f.k}">${v!=='?'?v:''}</textarea></div>`;}
    else{h+=`<div class="fg"><label>${f.l}${r}</label><input id="f_${f.k}" value="${v!=='?'?v:''}" placeholder="${f.l}"></div>`;}
  });
  h+=`<div class="fg"><label>حالة البيانات</label><select id="f_st"><option value="ok"${(!d||d.st==='ok')?' selected':''}>✓ مكتملة</option><option value="warn"${d&&d.st==='warn'?' selected':''}>◐ جزئية</option><option value="bad"${d&&d.st==='bad'?' selected':''}>✗ ناقصة</option></select></div>`;
  h+='</div>';document.getElementById('mform').innerHTML=h;
}
function saveR(){
  const key=editKey;const s=SCH[key];const obj={st:document.getElementById('f_st').value};
  s.fields.forEach(f=>{const el=document.getElementById('f_'+f.k);obj[f.k]=el?el.value.trim()||'?':'?'});
  if(editIdx===-1)DATA[key].push(obj);else DATA[key][editIdx]=obj;
  closeMD();const ki=KEYS.indexOf(key);renderSec(ki);updateStats();
}
function dR(key,i){if(!confirm('تأكيد الحذف؟'))return;DATA[key].splice(i,1);const ki=KEYS.indexOf(key);renderSec(ki);updateStats()}
function closeMB(e){if(e.target===document.getElementById('mb'))closeMD()}
function closeMD(){document.getElementById('mb').classList.remove('op')}
KEYS.forEach((_,i)=>renderSec(i));updateStats();
</script>
