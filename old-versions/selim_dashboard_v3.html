<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سليم للتسويق العقاري</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold2:#E8C97A;--gold3:#F5E4A8;
  --bg:#0A0A0A;--bg2:#111;--bg3:#181818;--bg4:#222;
  --border:#2A2A2A;--border2:#383838;
  --text:#F0E6C8;--text2:#C8B87A;--text3:#8A7A5A;
  --blue:#5AAAFF;--red:#FF6060;--green:#55DD88;--amber:#FFB830;
  --match:#8B5CF6;--match2:#A78BFA;
  --row-ok:rgba(90,170,255,.07);--row-warn:rgba(255,184,48,.07);--row-bad:rgba(255,96,96,.07);
  --row-match:rgba(139,92,246,.10);
  --stripe:rgba(255,255,255,.02);
}
body.light{
  --bg:#F5F0E8;--bg2:#FFFFFF;--bg3:#F0EAD8;--bg4:#E8E0CC;
  --border:#D0C8A8;--border2:#C0B890;
  --text:#2A1E00;--text2:#5A4A20;--text3:#9A8A60;
  --blue:#1A6AD0;--red:#CC2222;--green:#1A8840;--amber:#B07800;
  --match:#7C3AED;--match2:#6D28D9;
  --row-match:rgba(124,58,237,.08);
  --stripe:rgba(0,0,0,.02);
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;font-size:13px;transition:background .3s,color .3s}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:12px}
.logo-img{width:48px;height:48px;border-radius:10px;border:1px solid var(--gold);object-fit:cover;background:#000}
.logo-name{font-size:15px;font-weight:900;color:var(--gold2);line-height:1.1}
.logo-sub{font-size:10px;color:var(--text3);font-weight:400}
.topbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats-mini{display:flex;gap:5px;flex-wrap:wrap}
.sc{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 9px;text-align:center;min-width:48px}
.sc-n{font-size:15px;font-weight:900;color:var(--gold2);line-height:1}
.sc-l{font-size:9px;color:var(--text3);margin-top:1px}
.theme-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:6px 12px;border-radius:6px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.theme-btn:hover{border-color:var(--gold);color:var(--gold)}
.tabs{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .15s;font-family:'Cairo',sans-serif;display:flex;align-items:center;gap:5px}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab.match-tab.active{color:var(--match2);border-bottom-color:var(--match2)}
.tbadge{background:var(--bg4);color:var(--gold);font-size:10px;font-weight:900;padding:1px 5px;border-radius:8px;border:1px solid var(--border2)}
.tbadge.mbadge{color:var(--match2)}
.main{padding:16px 20px}
.sec{display:none}
.sec.active{display:block}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.sinput{flex:1;min-width:160px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 12px;border-radius:6px;font-family:'Cairo',sans-serif;font-size:12px;outline:none;transition:border .15s}
.sinput:focus{border-color:var(--gold)}
.sinput::placeholder{color:var(--text3)}
.fsel{background:var(--bg3);border:1px solid var(--border2);color:var(--text2);padding:7px 10px;border-radius:6px;font-family:'Cairo',sans-serif;font-size:11px;outline:none;cursor:pointer}
.btn-add{background:linear-gradient(135deg,#2A1E00,#3A2800);border:1px solid var(--gold);color:var(--gold);padding:7px 14px;border-radius:6px;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-add:hover{border-color:var(--gold2);color:var(--gold2)}
.legend{display:flex;gap:12px;margin-bottom:10px;font-size:11px;color:var(--text3);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%}
.ok-c{background:var(--blue)}.warn-c{background:var(--amber)}.bad-c{background:var(--red)}.match-c{background:var(--match)}
.twrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}
thead tr{background:var(--bg3)}
th{padding:9px 10px;text-align:right;font-weight:900;color:var(--gold);border-bottom:1px solid var(--border);white-space:nowrap;font-size:11px;cursor:pointer;user-select:none}
th:hover{color:var(--gold2)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:hover{background:var(--bg4)!important}
tbody tr.rOk{background:var(--row-ok)}
tbody tr.rWarn{background:var(--row-warn)}
tbody tr.rBad{background:var(--row-bad)}
tbody tr.rMatch{background:var(--row-match)}
tbody tr.rOk td:first-child{border-right:3px solid var(--blue)}
tbody tr.rWarn td:first-child{border-right:3px solid var(--amber)}
tbody tr.rBad td:first-child{border-right:3px solid var(--red)}
tbody tr.rMatch td:first-child{border-right:3px solid var(--match)}
tbody tr.hid{display:none}
td{padding:8px 10px;vertical-align:middle;color:var(--text2);font-weight:600}
td.nm{font-weight:900;color:var(--text)}
td.miss{color:var(--red);font-size:11px;font-weight:700}
td.nc{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text3);font-size:11px;font-weight:600}
.pbadge{background:var(--bg4);border:1px solid var(--border2);color:var(--gold2);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:900;white-space:nowrap}
.mbadge-inline{background:rgba(139,92,246,.15);border:1px solid var(--match);color:var(--match2);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:900;white-space:nowrap}
.urgent{background:rgba(255,96,96,.15);border:1px solid var(--red);color:var(--red);padding:2px 7px;border-radius:10px;font-size:10px;font-weight:900}
.donebtn{background:none;border:1px solid var(--border2);color:var(--text3);width:22px;height:22px;border-radius:4px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;margin:auto;transition:all .12s;font-weight:900}
.donebtn.ck{background:rgba(85,221,136,.12);border-color:var(--green);color:var(--green)}
.acell{display:flex;gap:4px;align-items:center;justify-content:center}
.ibtn{background:none;border:none;cursor:pointer;padding:3px 5px;border-radius:4px;transition:background .12s;font-size:14px;color:var(--text3);font-weight:900}
.ibtn:hover{background:var(--bg4);color:var(--text)}
.ibtn.dl:hover{background:rgba(255,96,96,.15);color:var(--red)}
/* Match section styles */
.match-section{margin-bottom:20px}
.match-header{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(139,92,246,.05));border:1px solid var(--match);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.match-header:hover{border-color:var(--match2)}
.match-title{font-size:13px;font-weight:900;color:var(--match2);display:flex;align-items:center;gap:8px}
.match-meta{font-size:11px;color:var(--text3);font-weight:600}
.match-body{display:none}
.match-body.open{display:block}
.match-buyer{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px}
.match-buyer-title{font-size:12px;font-weight:900;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.match-options{display:flex;flex-direction:column;gap:6px}
.match-option{background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.match-option.exact{border-color:var(--green);background:rgba(85,221,136,.06)}
.match-option.close{border-color:var(--amber);background:rgba(255,184,48,.06)}
.mo-info{flex:1;font-size:12px;color:var(--text);font-weight:700}
.mo-price{font-size:12px;font-weight:900;color:var(--gold2);white-space:nowrap}
.mo-phone{font-size:11px;color:var(--blue);font-weight:700;white-space:nowrap}
.mo-tag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:900}
.mo-tag.exact{background:rgba(85,221,136,.2);color:var(--green);border:1px solid var(--green)}
.mo-tag.close{background:rgba(255,184,48,.2);color:var(--amber);border:1px solid var(--amber)}
.priority-urgent{border-right:3px solid var(--red)!important}
.priority-high{border-right:3px solid var(--amber)!important}
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:none;align-items:center;justify-content:center}
.modal-back.op{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:22px;width:560px;max-width:95vw;max-height:88vh;overflow-y:auto;direction:rtl}
.mtitle{font-size:15px;font-weight:900;color:var(--gold2);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg.full{grid-column:1/-1}
.fg label{font-size:11px;color:var(--text3);font-weight:700}
.fg input,.fg select,.fg textarea{background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 10px;border-radius:6px;font-family:'Cairo',sans-serif;font-size:12px;outline:none;font-weight:600}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.fg textarea{resize:vertical;min-height:55px}
.mact{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.bsave{background:linear-gradient(135deg,#2A1E00,#3A2800);border:1px solid var(--gold);color:var(--gold);padding:8px 20px;border-radius:6px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:900;cursor:pointer}
.bcan{background:var(--bg3);border:1px solid var(--border2);color:var(--text3);padding:8px 16px;border-radius:6px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.bsave:hover{border-color:var(--gold2);color:var(--gold2)}
.bcan:hover{color:var(--text)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

      {info:'العاشرة ثالث شرقي بحري — 9000',price:'9000',phone:'01001349160',type:'close'},
    ]
  },
];

function sc(s){return s==='ok'?'rOk':s==='bad'?'rBad':'rWarn'}
function mv(x){const b=!x||x==='?'||x==='';return b?'<span class="miss">—</span>':x}
function mp(x){const b=!x||x==='?'||x==='';return b?'<span class="miss">—</span>':`<span class="pbadge">${x}</span>`}

function buildRows(key){
  const s=SCH[key],r=DATA[key];
  if(!r.length)return`<tr><td colspan="20" style="text-align:center;padding:30px;color:var(--text3)">لا توجد بيانات</td></tr>`;
  return r.map((row,i)=>{
    const dk=`d_${key}_${i}`,ck=localStorage.getItem(dk)==='1';
    const cells=s.fields.map(f=>{
      const v=row[f.k]||'?';
      if(f.k==='price'||f.k==='rent'||f.k==='budget')return`<td class="nm">${mp(v)}</td>`;
      if(f.t==='ta'||f.k==='note')return`<td class="nc" title="${v}">${v!=='?'?v:'—'}</td>`;
      return`<td>${mv(v)}</td>`;
    }).join('');
    return`<tr class="${sc(row.st)}"><td style="color:var(--text3);font-weight:700;font-size:11px">${i+1}</td>${cells}<td><button class="donebtn ${ck?'ck':''}" onclick="td2('${key}',${i},this)">✓</button></td><td><div class="acell"><button class="ibtn" onclick="oEd('${key}',${i})" title="تعديل">✏</button><button class="ibtn dl" onclick="dR('${key}',${i})" title="حذف">✕</button></div></td></tr>`;
  }).join('');
}

function renderSec(ki){
  const key=KEYS[ki];
  const s=SCH[key];
  document.getElementById('sec'+ki).innerHTML=`
    <div class="toolbar">
      <input class="sinput" placeholder="🔍 ابحث في أي حقل..." oninput="fRows(${ki},this.value)">
      <input class="sinput" placeholder="🏘 فلتر بالمنطقة..." oninput="fArea(${ki},this.value)" style="max-width:160px">
      <input class="sinput" placeholder="💰 فلتر بالسعر..." oninput="fPrice(${ki},this.value)" style="max-width:130px">
      <button class="btn-add" onclick="oAdd(${ki})">+ إضافة</button>
    </div>
    <div class="twrap"><table><thead><tr>${s.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="tb${ki}">${buildRows(key)}</tbody></table></div>`;
}

function renderMatches(){
  const c=document.getElementById('matches-container');
  let h='';
  MATCHES.forEach(m=>{
    const urgentClass=m.priority==='urgent'?'priority-urgent':'priority-high';
    const urgentBadge=m.priority==='urgent'?'<span class="urgent">🔴 فوري</span>':'<span class="urgent" style="background:rgba(255,184,48,.15);color:var(--amber);border-color:var(--amber)">🟡 مهم</span>';
    h+=`<div class="match-section" data-priority="${m.priority}" data-title="${m.title}">
      <div class="match-header" onclick="toggleMatch(${m.id})">
        <div class="match-title">🔗 ${m.title} ${urgentBadge}</div>
        <div class="match-meta">${m.options.length} خيار متاح ↕</div>
      </div>
      <div class="match-body" id="mb${m.id}">
        <div class="match-buyer">
          <div class="match-buyer-title">👤 المشتري/الطالب: ${m.buyer.name} | 📞 ${m.buyer.phone} | 💰 ${m.buyer.budget} | 📝 ${m.buyer.cond}</div>
          <div class="match-options">`;
    m.options.forEach(o=>{
      h+=`<div class="match-option ${o.type}">
        <span class="mo-info">${o.info}</span>
        <span class="mo-price">${o.price}</span>
        <span class="mo-phone">📞 ${o.phone}</span>
        <span class="mo-tag ${o.type}">${o.type==='exact'?'✅ مطابق':'⚠ قريب'}</span>
      </div>`;
    });
    h+=`</div></div></div></div>`;
  });
  c.innerHTML=h;
  document.getElementById('s7').textContent=MATCHES.length;
}

function toggleMatch(id){
  const el=document.getElementById('mb'+id);
  el.classList.toggle('open');
}
function filterMatches(q){
  document.querySelectorAll('.match-section').forEach(el=>{
    const t=el.dataset.title.toLowerCase();
    el.style.display=(!q||t.includes(q.toLowerCase()))?'':'none';
  });
}
function filterMatchPriority(p){
  document.querySelectorAll('.match-section').forEach(el=>{
    el.style.display=(!p||el.dataset.priority===p)?'':'none';
  });
}

function td2(key,i,el){const k=`d_${key}_${i}`,w=localStorage.getItem(k)==='1';localStorage.setItem(k,w?'0':'1');el.className='donebtn '+(w?'':'ck')}
function fRows(ki,q){document.querySelectorAll(`#tb${ki} tr`).forEach(r=>{r.classList.toggle('hid',!!q&&!r.textContent.toLowerCase().includes(q.toLowerCase()))})}
function fArea(ki,q){
  const key=KEYS[ki];
  document.querySelectorAll(`#tb${ki} tr`).forEach((r,i)=>{
    if(!q){r.classList.remove('hid');return;}
    const d=DATA[key][i];
    const areaVal=(d?(d.area||d.loc||''):'').toLowerCase();
    r.classList.toggle('hid',!areaVal.includes(q.toLowerCase()));
  });
}
function fPrice(ki,q){
  const key=KEYS[ki];
  document.querySelectorAll(`#tb${ki} tr`).forEach((r,i)=>{
    if(!q){r.classList.remove('hid');return;}
    const d=DATA[key][i];
    const pv=(d?(d.price||d.rent||d.budget||''):'').toString();
    const num=parseFloat(pv.replace(/[^\d.]/g,''));
    const qn=parseFloat(q);
    if(isNaN(num)||isNaN(qn)){r.classList.toggle('hid',!pv.includes(q));return;}
    r.classList.toggle('hid',Math.abs(num-qn)>qn*0.2);
  });
}
function sw(i,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('sec'+i).classList.add('active');
}
function updateStats(){KEYS.forEach((k,i)=>{const n=DATA[k].length;document.getElementById('s'+i).textContent=n;document.getElementById('b'+i).textContent=n})}
function oAdd(ki){editIdx=-1;editKey=KEYS[ki];document.getElementById('mtitle').textContent='+ إضافة '+SCH[editKey].title;bForm(editKey,null);document.getElementById('mb').classList.add('op')}
function oEd(key,i){editIdx=i;editKey=key;document.getElementById('mtitle').textContent='✏ تعديل '+SCH[key].title;bForm(key,DATA[key][i]);document.getElementById('mb').classList.add('op')}
function bForm(key,d){
  const s=SCH[key];
  let h='<div class="fgrid">';
  s.fields.forEach(f=>{
    const v=d?d[f.k]||'':'';const r=f.req?'*':'';
    if(f.t==='ta'){h+=`<div class="fg full"><label>${f.l}${r}</label><textarea id="f_${f.k}">${v!=='?'?v:''}</textarea></div>`;}
    else{h+=`<div class="fg"><label>${f.l}${r}</label><input id="f_${f.k}" value="${v!=='?'?v:''}" placeholder="${f.l}"></div>`;}
  });
  h+=`<div class="fg"><label>حالة البيانات</label><select id="f_st"><option value="ok"${(!d||d.st==='ok')?' selected':''}>✓ مكتملة</option><option value="warn"${d&&d.st==='warn'?' selected':''}>◐ جزئية</option><option value="bad"${d&&d.st==='bad'?' selected':''}>✗ ناقصة</option></select></div>`;
  h+='</div>';document.getElementById('mform').innerHTML=h;
}
function saveR(){
  const key=editKey;const s=SCH[key];const obj={st:document.getElementById('f_st').value};
  s.fields.forEach(f=>{const el=document.getElementById('f_'+f.k);obj[f.k]=el?el.value.trim()||'?':'?'});
  if(editIdx===-1)DATA[key].push(obj);else DATA[key][editIdx]=obj;
  closeMD();const ki=KEYS.indexOf(key);renderSec(ki);updateStats();
}
function dR(key,i){if(!confirm('تأكيد الحذف؟'))return;DATA[key].splice(i,1);const ki=KEYS.indexOf(key);renderSec(ki);updateStats()}
function closeMB(e){if(e.target===document.getElementById('mb'))closeMD()}
function closeMD(){document.getElementById('mb').classList.remove('op')}
KEYS.forEach((_,i)=>renderSec(i));updateStats();renderMatches();
</script>
</body>
</html>
