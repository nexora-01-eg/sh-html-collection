    const c=covers[i];
    const el=document.createElement('div');
    el.innerHTML=cover(BG[c.bg],GL[c.bg],c.svg,c.domain,c.name,c.desc,c.num);
    grid.appendChild(el.firstChild);
  }
  root.appendChild(grid);
});
</script>

<div id="root"></div>

</body>
</html>
