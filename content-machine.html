<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Machine – مصنع المحتوى</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #ff6b2b;
    --accent2: #ffb347;
    --gold: #f5c842;
    --text: #f0f0f5;
    --muted: #7a7a9a;
    --green: #2ecc71;
    --blue: #3b82f6;
    --purple: #a855f7;
    --pink: #ec4899;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG Glow */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 800px; height: 400px;
    background: radial-gradient(ellipse, rgba(255,107,43,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }

  /* Header */
  .header { text-align: center; margin-bottom: 50px; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    font-size: 14px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .logo-icon { font-size: 20px; -webkit-text-fill-color: var(--accent); }
  h1 {
    font-size: clamp(32px, 6vw, 56px); font-weight: 900; line-height: 1.1;
    margin-bottom: 12px;
  }
  h1 span { 
    background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 16px; }

  /* Input Section */
  .input-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }
  .input-section::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), var(--gold));
  }

  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media(max-width: 600px){ .input-grid { grid-template-columns: 1fr; } }

  .field label {
    display: block; font-size: 13px; font-weight: 700;
    color: var(--accent2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
  }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px; color: var(--text);
    font-family: 'Cairo', sans-serif; font-size: 15px;
    transition: border-color 0.2s;
    outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--accent);
  }
  .field textarea { resize: vertical; min-height: 80px; }
  .field select option { background: var(--surface); }

  .generate-btn {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-family: 'Cairo', sans-serif;
    font-size: 18px; font-weight: 900; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 1px;
  }
  .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,107,43,0.4); }
  .generate-btn:active { transform: translateY(0); }

  /* Output */
  #output { display: none; animation: fadeIn 0.5s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .product-header {
    background: linear-gradient(135deg, rgba(255,107,43,0.15), rgba(255,179,71,0.08));
    border: 1px solid rgba(255,107,43,0.3);
    border-radius: 16px; padding: 24px 28px; margin-bottom: 28px;
    display: flex; align-items: center; gap: 16px;
  }
  .product-icon { font-size: 36px; }
  .product-title { font-size: 22px; font-weight: 900; color: var(--accent2); }
  .product-problem { font-size: 14px; color: var(--muted); margin-top: 4px; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab {
    padding: 9px 18px; border-radius: 30px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab.active, .tab:hover {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

  /* Cards */
  .section-title {
    font-size: 13px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .content-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 22px; margin-bottom: 14px;
    position: relative; overflow: hidden; cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }
  .content-card:hover { border-color: var(--accent); transform: translateY(-2px); }

  .card-num {
    position: absolute; top: 16px; left: 18px;
    font-size: 11px; font-weight: 900; letter-spacing: 1px;
    color: var(--accent); opacity: 0.7;
  }
  .card-badge {
    display: inline-block; padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; margin-bottom: 10px;
  }
  .badge-video { background: rgba(59,130,246,0.15); color: var(--blue); }
  .badge-post { background: rgba(168,85,247,0.15); color: var(--purple); }
  .badge-story { background: rgba(236,72,153,0.15); color: var(--pink); }
  .badge-article { background: rgba(245,200,66,0.15); color: var(--gold); }
  .badge-hook { background: rgba(46,204,113,0.15); color: var(--green); }

  .card-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; line-height: 1.4; }
  .card-body { font-size: 14px; color: var(--muted); line-height: 1.7; }
  .card-body strong { color: var(--text); }
  .card-hook {
    margin-top: 12px; padding: 12px 14px;
    background: rgba(255,107,43,0.08); border-right: 3px solid var(--accent);
    border-radius: 0 8px 8px 0; font-size: 14px; color: var(--accent2);
    font-weight: 600;
  }

  /* Story grid */
  .story-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .story-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; text-align: center;
    transition: border-color 0.2s, transform 0.15s; cursor: pointer;
  }
  .story-card:hover { border-color: var(--pink); transform: translateY(-2px); }
  .story-num { font-size: 28px; font-weight: 900; color: var(--pink); margin-bottom: 6px; }
  .story-day { font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }
  .story-text { font-size: 13px; font-weight: 600; line-height: 1.5; }

  /* Summary */
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media(max-width: 500px){ .summary-grid { grid-template-columns: repeat(2, 1fr); } }
  .summary-stat {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: center;
  }
  .stat-num { font-size: 30px; font-weight: 900; color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--muted); font-weight: 600; }

  /* Copy btn */
  .copy-all-btn {
    display: block; width: 100%; margin-top: 24px;
    padding: 14px; border: 1px solid var(--border); border-radius: 10px;
    background: transparent; color: var(--muted); font-family: 'Cairo', sans-serif;
    font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s;
  }
  .copy-all-btn:hover { border-color: var(--accent); color: var(--accent); }

  .loading {
    text-align: center; padding: 40px;
    color: var(--muted); font-size: 16px;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 12px 24px;
    border-radius: 30px; font-weight: 700; font-size: 14px;
    opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo"><span class="logo-icon">⚡</span> CONTENT MACHINE</div>
    <h1>مصنع <span>المحتوى</span> الآلي</h1>
    <p class="subtitle">أدخل منتجك الرقمي → احصل على 15+ قطعة محتوى جاهزة فورًا</p>
  </div>

  <div class="input-section">
    <div class="input-grid">
      <div class="field">
        <label>🎯 اسم المنتج الرقمي</label>
        <input type="text" id="productName" placeholder="مثال: Template تنظيم الأعمال" />
      </div>
      <div class="field">
        <label>💥 المشكلة اللي بيحلها</label>
        <input type="text" id="problemText" placeholder="مثال: تضييع الوقت وعدم الإنجاز" />
      </div>
      <div class="field">
        <label>👤 الجمهور المستهدف</label>
        <input type="text" id="audience" placeholder="مثال: فريلانسرز، أصحاب مشاريع" />
      </div>
      <div class="field">
        <label>📦 نوع المنتج</label>
        <select id="productType">
          <option value="template">Template / قالب</option>
          <option value="ebook">Ebook / كتاب رقمي</option>
          <option value="course">كورس / دورة</option>
          <option value="tool">أداة / Tool</option>
          <option value="checklist">Checklist / قائمة</option>
          <option value="notion">Notion Dashboard</option>
          <option value="prompt">Prompt Pack</option>
          <option value="other">أخرى</option>
        </select>
      </div>
    </div>
    <div class="field" style="margin-bottom:20px;">
      <label>✨ الفائدة الرئيسية (نتيجة استخدامه)</label>
      <input type="text" id="benefit" placeholder="مثال: توفير 3 ساعات يوميًا وإنجاز أكثر" />
    </div>
    <button class="generate-btn" onclick="generateContent()">⚡ اصنع خطة المحتوى الكاملة</button>
  </div>

  <div id="output">
    <div class="product-header">
      <div class="product-icon">🚀</div>
      <div>
        <div class="product-title" id="out-title"></div>
        <div class="product-problem" id="out-problem"></div>
      </div>
    </div>

    <div class="summary-grid" style="margin-bottom:28px;" id="summaryGrid"></div>

    <div class="tabs" id="tabsBar"></div>

    <div id="tabContents"></div>

    <button class="copy-all-btn" onclick="copyAll()">📋 نسخ كل المحتوى</button>
  </div>

</div>

<div class="toast" id="toast">✅ تم النسخ!</div>

<script>
function generateContent() {
  const name = document.getElementById('productName').value.trim();
  const problem = document.getElementById('problemText').value.trim();
  const audience = document.getElementById('audience').value.trim() || 'الجمهور المستهدف';
  const type = document.getElementById('productType').value;
  const benefit = document.getElementById('benefit').value.trim() || 'توفير الوقت وتحقيق النتائج';

  if (!name || !problem) {
    alert('⚠️ اكتب اسم المنتج والمشكلة الأول!');
    return;
  }

  const output = document.getElementById('output');
  output.style.display = 'none';

  // Simulate brief processing
  setTimeout(() => buildOutput(name, problem, audience, type, benefit), 400);
}

function buildOutput(name, problem, audience, type, benefit) {
  document.getElementById('out-title').textContent = name;
  document.getElementById('out-problem').textContent = `🎯 يحل مشكلة: ${problem} — لـ ${audience}`;

  const videos = generateVideos(name, problem, audience, benefit);
  const posts = generatePosts(name, problem, audience, benefit);
  const stories = generateStories(name, problem, audience, benefit);
  const article = generateArticle(name, problem, audience, benefit);
  const hooks = generateHooks(name, problem, audience, benefit);

  // Summary
  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-stat"><div class="stat-num">5</div><div class="stat-label">🎬 فيديوهات</div></div>
    <div class="summary-stat"><div class="stat-num">3</div><div class="stat-label">📝 بوستات</div></div>
    <div class="summary-stat"><div class="stat-num">7</div><div class="stat-label">📱 ستوري</div></div>
    <div class="summary-stat"><div class="stat-num">15+</div><div class="stat-label">⚡ قطعة محتوى</div></div>
  `;

  // Tabs
  const tabs = [
    { id: 'videos', label: '🎬 فيديوهات' },
    { id: 'posts', label: '📝 بوستات' },
    { id: 'stories', label: '📱 ستوري' },
    { id: 'article', label: '📄 مقال' },
    { id: 'hooks', label: '🔥 هوكات' },
  ];

  document.getElementById('tabsBar').innerHTML = tabs.map((t, i) =>
    `<button class="tab ${i===0?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`
  ).join('');

  document.getElementById('tabContents').innerHTML = `
    <div class="tab-content active" id="tab-videos">${renderVideos(videos)}</div>
    <div class="tab-content" id="tab-posts">${renderPosts(posts)}</div>
    <div class="tab-content" id="tab-stories">${renderStories(stories)}</div>
    <div class="tab-content" id="tab-article">${renderArticle(article, name, problem, benefit)}</div>
    <div class="tab-content" id="tab-hooks">${renderHooks(hooks)}</div>
  `;

  document.getElementById('output').style.display = 'block';
  document.getElementById('output').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function generateVideos(name, problem, audience, benefit) {
  return [
    {
      num: '01', type: 'المشكلة', icon: '🔥',
      title: `90% من ${audience} بيعانوا من "${problem}" ومش عارفين ليه`,
      hook: `افتح بـ: "لو بتعاني من ${problem}، الفيديو ده هيغير طريقة تفكيرك."`,
      body: `اشرح المشكلة بالتفصيل — خلي الناس يحسوا إنك بتتكلم عنهم شخصيًا. اذكر الخسارة: وقت، فلوس، طاقة.`,
      cta: 'الحل في الفيديو الجاي 👇'
    },
    {
      num: '02', type: 'الحل', icon: '💡',
      title: `الطريقة الوحيدة اللي تخليك ${benefit} من غير ${problem}`,
      hook: `"في ${benefit} بس لو عملت الخطوات الـ3 دول."`,
      body: `قدم الحل بشكل عملي — خطوة خطوة. في الآخر قول: "أنا عملت ${name} عشان يعمل الخطوات دي تلقائيًا."`,
      cta: `لينك ${name} في البايو 🔗`
    },
    {
      num: '03', type: 'القصة', icon: '📖',
      title: `أنا كنت بعاني من ${problem}... لحد ما عملت ${name}`,
      hook: `"كنت زيك بالظبط — بقاله X شهور بحاول أحل ${problem}."`,
      body: `حكاية شخصية — المشكلة، المحاولات الفاشلة، اكتشاف الحل، النتيجة. القصة أقوى أداة بيع.`,
      cta: 'الأداة في البايو لو حابب تجربها'
    },
    {
      num: '04', type: 'الشرح', icon: '🖥️',
      title: `شرح سريع: إزاي تستخدم ${name} في أقل من 5 دقايق`,
      hook: `"خليني أوريك بالظبط إزاي بيشتغل — screen recording مباشر."`,
      body: `Screen recording للمنتج — أظهر أهم 3 مميزات. خلي الناس يحسوا إنه سهل وسريع.`,
      cta: 'النسخة الكاملة في البايو'
    },
    {
      num: '05', type: 'CTA', icon: '🎯',
      title: `لو ${problem} بتأثر عليك — ${name} جاهز دلوقتي`,
      hook: `"مش بيع — بس لو الفيديوهات اللي فاتت أفادتك، في حاجة عملتها ليك."`,
      body: `تكلم بصراحة عن المنتج — سعره، ايه اللي جوه، مين محتاجه. خليه إنساني مش إعلان.`,
      cta: `رابط ${name} في البايو 👆`
    }
  ];
}

function generatePosts(name, problem, audience, benefit) {
  return [
    {
      type: 'قائمة',
      title: `5 أسباب بتخلي ${audience} فاشل في حل "${problem}"`,
      body: `1️⃣ [سبب 1] — اشرح\n2️⃣ [سبب 2] — اشرح\n3️⃣ [سبب 3] — اشرح\n4️⃣ [سبب 4] — اشرح\n5️⃣ [سبب 5] — اشرح\n\n💡 الحل الأسهل؟ استخدم نظام جاهز زي ${name}`,
      tip: 'أكثر نوع بوست بيتشارك — اعتمد عليه كتير'
    },
    {
      type: 'تعليم',
      title: `أفضل طريقة تحقق "${benefit}" في أقل وقت ممكن`,
      body: `الطريقة اللي بستخدمها:\n\nالخطوة 1: [اشرح]\nالخطوة 2: [اشرح]\nالخطوة 3: [اشرح]\n\nالنتيجة: ${benefit}\n\n🛠️ أنا عملت ${name} عشان أتمتة الخطوات دي — موجود في البايو.`,
      tip: 'يبني ثقة ويضع المنتج كـ tool مش إعلان'
    },
    {
      type: 'قصة',
      title: `ليه عملت ${name}؟ القصة الحقيقية`,
      body: `كنت بعاني من ${problem}.\n\nجربت كل حاجة — محدش حلها بالشكل الصح.\n\nقررت أعمل الحل بنفسي.\n\nالنتيجة كانت ${benefit}.\n\nبعدين قررت أوفر ${name} للناس اللي زي ما أنا كنت. 🙌\n\nلو محتاجه — في البايو.`,
      tip: 'أكثر بوست بيخلق connection — استخدمه مرة كل أسبوعين'
    }
  ];
}

function generateStories(name, problem, audience, benefit) {
  return [
    { day: 'اليوم 1', icon: '🙋', text: `"مين منكم بيعاني من ${problem}؟\nرد بـ 🔥 لو الموضوع ده بيأثر عليك"` },
    { day: 'اليوم 2', icon: '📊', text: `تصويت:\n"تحب أشرح طريقة أسرع لـ ${benefit}؟"\n✅ أيوه  |  ❌ لأ` },
    { day: 'اليوم 3', icon: '👀', text: `"خليني أوريك لقطة سريعة من ${name} 👇"\n[صورة أو لقطة من المنتج]` },
    { day: 'اليوم 4', icon: '💡', text: `"أهم ميزة في ${name}:\n${benefit} في وقت أقل بكتير"\nسؤال: إيه أكتر حاجة بتضيع وقتك؟` },
    { day: 'اليوم 5', icon: '🗣️', text: `"شاركوني — ${problem} بيأثر عليكم في ايه بالظبط؟"\n[اسأل رأيهم — الـ engagement بيطلع 🔥]` },
    { day: 'اليوم 6', icon: '🛒', text: `"طيب — لو حابب ${benefit} بدون ${problem}:\n${name} جاهز ليك 👇"` },
    { day: 'اليوم 7', icon: '🔗', text: `[اضغط على البايو]\n"${name} — متاح دلوقتي"\nلو عندك سؤال — ردلك في الـ DM` }
  ];
}

function generateArticle(name, problem, audience, benefit) {
  return {
    title: `إزاي ${audience} يحقق "${benefit}" بدون "${problem}" — الدليل الكامل`,
    intro: `لو أنت من ${audience} وعندك مشكلة مع "${problem}"، المقال ده هيديك طريقة عملية خطوة بخطوة.`,
    sections: [
      `لماذا يعاني ${audience} من "${problem}"؟`,
      `الأخطاء الشائعة في محاولة الحل`,
      `الطريقة الصح لتحقيق "${benefit}"`,
      `كيف يساعدك ${name} في تأتمة العملية`,
      `خطوات البداية من الصفر`
    ],
    cta: `جرب ${name} وابدأ رحلتك نحو ${benefit} من النهارده.`
  };
}

function generateHooks(name, problem, audience, benefit) {
  return [
    { hook: `"${audience} اللي بيعانوا من ${problem} — الفيديو ده بالظبط ليهم."` },
    { hook: `"90% من ${audience} مش عارفين إن ${problem} ممكن تتحل في أقل من 10 دقايق."` },
    { hook: `"لو بتضيع وقتك في ${problem} — في سبب واحد بس ليه."` },
    { hook: `"أنا وفرت ${benefit} بعد ما اكتشفت الطريقة دي."` },
    { hook: `"مين قالك إن ${problem} مش ليها حل؟ اتفرج على ده."` },
    { hook: `"الفرق بين اللي بينجز واللي مش بينجز؟ نظام واحد بس."` },
    { hook: `"وقفت 3 ثواني — خليني أوريك حاجة هتغير طريقة شغلك."` }
  ];
}

function renderVideos(videos) {
  return `<div class="section-title">🎬 5 فيديوهات جاهزة للتصوير أو السكرين ريكورد</div>` +
    videos.map(v => `
      <div class="content-card">
        <div class="card-num">${v.num}</div>
        <span class="card-badge badge-video">${v.icon} ${v.type}</span>
        <div class="card-title">${v.title}</div>
        <div class="card-body">${v.body}</div>
        <div class="card-hook">🎣 هوك الافتتاح: ${v.hook}</div>
        <div class="card-body" style="margin-top:10px; color:#f5c842;">📣 CTA: <strong>${v.cta}</strong></div>
      </div>
    `).join('');
}

function renderPosts(posts) {
  return `<div class="section-title">📝 3 بوستات جاهزة للنشر</div>` +
    posts.map((p, i) => `
      <div class="content-card">
        <div class="card-num">0${i+1}</div>
        <span class="card-badge badge-post">📝 ${p.type}</span>
        <div class="card-title">${p.title}</div>
        <div class="card-body" style="white-space:pre-line">${p.body}</div>
        <div class="card-hook">💡 نصيحة: ${p.tip}</div>
      </div>
    `).join('');
}

function renderStories(stories) {
  return `<div class="section-title">📱 7 ستوري يومية — ترتيب كامل</div>
  <div class="story-grid">` +
    stories.map((s, i) => `
      <div class="story-card">
        <div class="story-num">${s.icon}</div>
        <div class="story-day">${s.day}</div>
        <div class="story-text">${s.text}</div>
      </div>
    `).join('') + `</div>`;
}

function renderArticle(article, name, problem, benefit) {
  return `<div class="section-title">📄 فكرة مقال / دليل كامل</div>
  <div class="content-card">
    <span class="card-badge badge-article">📄 مقال</span>
    <div class="card-title">${article.title}</div>
    <div class="card-body">
      <strong>المقدمة:</strong><br>${article.intro}<br><br>
      <strong>الأقسام الرئيسية:</strong><br>
      ${article.sections.map((s,i) => `${i+1}. ${s}`).join('<br>')}
      <br><br>
      <strong>الـ CTA:</strong> ${article.cta}
    </div>
  </div>`;
}

function renderHooks(hooks) {
  return `<div class="section-title">🔥 7 هوك قوي تفتح بيه أي محتوى</div>` +
    hooks.map((h, i) => `
      <div class="content-card">
        <div class="card-num">0${i+1}</div>
        <span class="card-badge badge-hook">🔥 هوك</span>
        <div class="card-title">${h.hook}</div>
      </div>
    `).join('');
}

function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', t.textContent.includes(id === 'videos' ? 'فيديو' : id === 'posts' ? 'بوست' : id === 'stories' ? 'ستوري' : id === 'article' ? 'مقال' : 'هوك'));
  });
  // simpler approach
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
}

function copyAll() {
  const name = document.getElementById('productName').value;
  const problem = document.getElementById('problemText').value;
  const benefit = document.getElementById('benefit').value;
  const text = `خطة محتوى: ${name}\nالمشكلة: ${problem}\nالفائدة: ${benefit}\n\n--- تم التوليد بواسطة Content Machine ---`;
  navigator.clipboard.writeText(text).then(() => showToast());
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
</body>
</html>
