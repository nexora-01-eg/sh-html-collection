<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

:root {
  --bg: #080810;
  --s1: #0f0f1a;
  --s2: #151522;
  --border: #252535;
  --gold: #C9A84C;
  --gold2: #F0D070;
  --text: #EEE8DC;
  --muted: #6a6880;
  --accent: #C9A84C;
  --green: #2ECC71;
  --blue: #3B82F6;
  --purple: #A855F7;
  --red: #EF4444;
  --orange: #F97316;
  --cyan: #06B6D4;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

/* Ambient glow */
body::before {
  content:''; position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:700px; height:300px;
  background:radial-gradient(ellipse, rgba(201,168,76,.07) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

.wrap { max-width:1100px; margin:0 auto; padding:40px 20px; position:relative; z-index:1; }

/* ── HEADER ── */
.header { text-align:center; padding-bottom:48px; }
.badge {
  display:inline-flex; align-items:center; gap:8px;
  border:1px solid rgba(201,168,76,.3); border-radius:50px;
  padding:6px 18px; font-size:11px; font-weight:700;
  color:var(--gold); letter-spacing:2px; margin-bottom:20px;
  background:rgba(201,168,76,.05);
}
.header h1 { font-size:clamp(28px,5vw,52px); font-weight:900; line-height:1.1; margin-bottom:10px; }
.header h1 span { color:var(--gold); }
.header p { color:var(--muted); font-size:15px; max-width:500px; margin:0 auto; line-height:1.8; }

/* ── STATS BAR ── */
.stats-bar {
  display:flex; gap:1px; background:var(--border);
  border-radius:14px; overflow:hidden; margin-bottom:36px;
}
.stat {
  flex:1; background:var(--s1); padding:18px 10px; text-align:center;
}
.stat-n { font-size:28px; font-weight:900; color:var(--gold); line-height:1; }
.stat-l { font-size:10px; color:var(--muted); margin-top:4px; font-weight:700; letter-spacing:1px; }

/* ── FILTER BAR ── */
.filters {
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px;
}
.filter-btn {
  padding:7px 16px; border-radius:30px; border:1px solid var(--border);
  background:transparent; color:var(--muted); font-family:'Cairo',sans-serif;
  font-size:12px; font-weight:700; cursor:pointer; transition:all .2s;
  white-space:nowrap;
}
.filter-btn:hover, .filter-btn.active {
  background:var(--gold); border-color:var(--gold); color:#000;
}

/* ── SEARCH ── */
.search-wrap { position:relative; margin-bottom:28px; }
.search-wrap input {
  width:100%; background:var(--s1); border:1px solid var(--border);
  border-radius:12px; padding:14px 20px 14px 46px;
  color:var(--text); font-family:'Cairo',sans-serif; font-size:15px;
  outline:none; transition:border-color .2s;
}
.search-wrap input:focus { border-color:var(--gold); }
.search-wrap input::placeholder { color:var(--muted); }
.search-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--muted); }

/* ── GRID ── */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(310px,1fr)); gap:16px; }

/* ── PRODUCT CARD ── */
.pcard {
  background:var(--s1); border:1px solid var(--border); border-radius:16px;
  overflow:hidden; cursor:pointer; transition:border-color .25s, transform .2s;
  position:relative;
}
.pcard:hover { border-color:rgba(201,168,76,.5); transform:translateY(-3px); }
.pcard.expanded { border-color:var(--gold); }

.pcard-top {
  padding:20px 20px 16px;
  border-bottom:1px solid transparent;
  transition:border-color .25s;
}
.pcard.expanded .pcard-top { border-color:var(--border); }

.pcard-row1 { display:flex; align-items:flex-start; gap:12px; margin-bottom:10px; }
.pcard-emoji { font-size:28px; flex-shrink:0; }
.pcard-meta { flex:1; min-width:0; }
.craft-tag {
  font-size:9.5px; font-weight:700; letter-spacing:2px;
  color:var(--gold); margin-bottom:4px; text-transform:uppercase;
}
.pcard-name { font-size:15px; font-weight:800; line-height:1.3; }
.pcard-num {
  width:26px; height:26px; border-radius:50%; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; color:var(--muted); flex-shrink:0;
}

.problem-pill {
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.2);
  border-radius:20px; padding:4px 10px; font-size:11px; color:#fc8080;
  font-weight:600;
}

/* Content preview */
.pcard-preview {
  padding:0 20px 16px; display:flex; gap:8px; flex-wrap:wrap;
}
.mini-badge {
  font-size:10px; font-weight:700; padding:3px 8px; border-radius:10px;
}
.mb-video { background:rgba(59,130,246,.12); color:var(--blue); }
.mb-post { background:rgba(168,85,247,.12); color:var(--purple); }
.mb-story { background:rgba(249,115,22,.12); color:var(--orange); }
.mb-hook { background:rgba(6,182,212,.12); color:var(--cyan); }

/* Expand arrow */
.expand-icon {
  position:absolute; bottom:14px; left:16px;
  font-size:11px; color:var(--muted); transition:transform .25s;
}
.pcard.expanded .expand-icon { transform:rotate(180deg); }

/* ── EXPANDED CONTENT ── */
.pcard-detail {
  display:none; padding:20px; background:rgba(0,0,0,.2);
  border-top:1px solid var(--border);
}
.pcard.expanded .pcard-detail { display:block; animation:slideIn .25s ease; }
@keyframes slideIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

.detail-section { margin-bottom:18px; }
.detail-section:last-child { margin-bottom:0; }
.detail-label {
  font-size:10px; font-weight:700; letter-spacing:2px;
  color:var(--gold); text-transform:uppercase; margin-bottom:10px;
  display:flex; align-items:center; gap:6px;
}
.detail-label::after { content:''; flex:1; height:1px; background:var(--border); }

.content-item {
  background:var(--s2); border-radius:10px; padding:12px 14px;
  margin-bottom:8px; border-right:3px solid var(--border);
  transition:border-color .2s;
}
.content-item:hover { border-color:var(--gold); }
.ci-type { font-size:9px; font-weight:700; letter-spacing:1px; color:var(--muted); margin-bottom:4px; }
.ci-text { font-size:13px; font-weight:600; line-height:1.5; }
.ci-hook {
  margin-top:6px; font-size:12px; color:var(--gold);
  padding-top:6px; border-top:1px solid var(--border);
}

.copy-btn {
  width:100%; margin-top:14px; padding:10px;
  background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.3);
  border-radius:8px; color:var(--gold); font-family:'Cairo',sans-serif;
  font-size:12px; font-weight:700; cursor:pointer; transition:all .2s;
}
.copy-btn:hover { background:rgba(201,168,76,.2); }

/* ── NO RESULTS ── */
.no-results { text-align:center; padding:60px 20px; color:var(--muted); }
.no-results .nr-icon { font-size:48px; margin-bottom:12px; }

/* ── TOAST ── */
.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  background:var(--gold); color:#000; padding:10px 22px;
  border-radius:30px; font-weight:700; font-size:13px;
  opacity:0; transition:opacity .3s; z-index:999; pointer-events:none;
  white-space:nowrap;
}
.toast.show { opacity:1; }

/* ── COUNT BAR ── */
.count-bar {
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:16px; font-size:13px;
}
.count-num { color:var(--gold); font-weight:700; }
.count-label { color:var(--muted); }
</style>

// Build craft list
const crafts = ['الكل', ...new Set(PRODUCTS.map(p => p.craft))];
let activeFilter = 'الكل';
let searchQuery = '';

function init() {
  const bar = document.getElementById('filterBar');
  bar.innerHTML = crafts.map(c =>
    `<button class="filter-btn ${c==='الكل'?'active':''}" onclick="setFilter('${c}', this)">${c}</button>`
  ).join('');
  renderProducts();
}

function setFilter(craft, btn) {
  activeFilter = craft;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

function filterProducts() {
  searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
  renderProducts();
}

function getFiltered() {
  return PRODUCTS.filter(p => {
    const matchCraft = activeFilter === 'الكل' || p.craft === activeFilter;
    const matchSearch = !searchQuery ||
      p.name.toLowerCase().includes(searchQuery) ||
      p.craft.toLowerCase().includes(searchQuery) ||
      p.problem.toLowerCase().includes(searchQuery);
    return matchCraft && matchSearch;
  });
}

function renderProducts() {
  const filtered = getFiltered();
  const grid = document.getElementById('productsGrid');
  const noRes = document.getElementById('noResults');
  const countNum = document.getElementById('countNum');
  countNum.textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  grid.innerHTML = filtered.map(p => buildCard(p)).join('');
}

function buildCard(p) {
  return `
    <div class="pcard" id="card-${p.id}" onclick="toggleCard(${p.id})">
      <div class="pcard-top">
        <div class="pcard-row1">
          <div class="pcard-emoji">${p.emoji}</div>
          <div class="pcard-meta">
            <div class="craft-tag">${p.craft} • ${p.type}</div>
            <div class="pcard-name">${p.name}</div>
          </div>
          <div class="pcard-num">${p.id}</div>
        </div>
        <div class="problem-pill">🔴 ${p.problem}</div>
      </div>
      <div class="pcard-preview">
        <span class="mini-badge mb-video">🎬 5 فيديو</span>
        <span class="mini-badge mb-post">📝 3 بوست</span>
        <span class="mini-badge mb-story">📱 7 ستوري</span>
        <span class="mini-badge mb-hook">🔥 هوك</span>
      </div>
      <span class="expand-icon">▼ اضغط للمحتوى</span>
      <div class="pcard-detail" id="detail-${p.id}">
        <div class="detail-section">
          <div class="detail-label">🔥 الهوك الرئيسي</div>
          <div class="content-item" style="border-color:var(--gold);">
            <div class="ci-text" style="color:var(--gold2);">${p.hook}</div>
          </div>
        </div>
        <div class="detail-section">
          <div class="detail-label">🎬 أفكار الفيديوهات الـ5</div>
          ${p.videos.map((v,i) => `
            <div class="content-item">
              <div class="ci-type">فيديو ${i+1}</div>
              <div class="ci-text">${v}</div>
            </div>
          `).join('')}
        </div>
        <div class="detail-section">
          <div class="detail-label">📝 البوستات الـ3</div>
          ${p.posts.map((v,i) => `
            <div class="content-item">
              <div class="ci-type">بوست ${i+1}</div>
              <div class="ci-text">${v}</div>
            </div>
          `).join('')}
        </div>
        <div class="detail-section">
          <div class="detail-label">📱 ستوري الـ7 أيام</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;">
            ${p.stories.map((s,i) => `
              <div class="content-item" style="text-align:center;padding:10px;">
                <div class="ci-type">يوم ${i+1}</div>
                <div class="ci-text" style="font-size:12px;">${s}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <button class="copy-btn" onclick="copyProduct(event, ${p.id})">📋 نسخ خطة محتوى هذا المنتج</button>
      </div>
    </div>
  `;
}

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  card.classList.toggle('expanded');
}

function copyProduct(e, id) {
  e.stopPropagation();
  const p = PRODUCTS.find(x => x.id === id);
  const text = `📦 ${p.name}\n🎯 المشكلة: ${p.problem}\n🔥 الهوك: ${p.hook}\n\n🎬 الفيديوهات:\n${p.videos.map((v,i)=>`${i+1}. ${v}`).join('\n')}\n\n📝 البوستات:\n${p.posts.map((v,i)=>`${i+1}. ${v}`).join('\n')}\n\n📱 الستوري:\n${p.stories.map((v,i)=>`يوم ${i+1}: ${v}`).join('\n')}`;
  navigator.clipboard.writeText(text).then(showToast);
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

init();
</script>
