  border:3px solid var(--gold);
  box-shadow:0 0 0 6px rgba(226,163,61,.16), 0 14px 30px rgba(0,0,0,.45);
  animation:floatY 5s ease-in-out infinite;
}
@keyframes floatY{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-9px);}
}
.hero-title{
  font-size:clamp(34px,9vw,56px);
  color:var(--gold-soft);
  margin:0;
  line-height:1.05;
  text-shadow:0 0 22px rgba(226,163,61,.4), 2px 3px 0 rgba(0,0,0,.45);
}
.hero-eng{
  margin:2px 0 0;
  letter-spacing:6px;
  font-size:12px;
  color:rgba(255,251,239,.65);
  text-transform:uppercase;
}
.hero-tag{
  margin:14px 0 0;
  font-size:15px;
  color:var(--paper);
  opacity:.9;
  font-weight:500;
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
}
.hero-tag .dot{color:var(--gold); opacity:.7;}
.hero-ctas{
  display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  margin-top:22px;
}
.btn{
  display:inline-flex; align-items:center; gap:8px;
  padding:11px 24px;
  border-radius:999px;
  font-weight:800; font-size:15.5px;
  text-decoration:none;
  transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.btn:active{transform:scale(.96);}
.btn-primary{
  background:linear-gradient(135deg,var(--tomato),var(--tomato-dark));
  color:#fff;
  box-shadow:0 8px 20px rgba(200,30,44,.45);
}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 26px rgba(200,30,44,.55);}
.btn-ghost{
  background:rgba(255,251,239,.08);
  color:var(--paper);
  border:1.5px solid rgba(243,205,128,.55);
  backdrop-filter:blur(4px);
}
.btn-ghost:hover{background:rgba(243,205,128,.15); transform:translateY(-2px);}
.scroll-cue{
  position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
  z-index:2; color:var(--gold-soft); opacity:.8;
  animation:bounceY 1.8s ease-in-out infinite;
  font-size:22px;
}
@keyframes bounceY{0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(7px);}}

/* ===== Nav ===== */
.nav-wrap{
  position:sticky; top:0; z-index:50;
  background:rgba(27,14,8,.92);
  backdrop-filter:blur(8px);
  border-bottom:3px solid var(--gold);
}
.nav{
  position:relative;
  display:flex;
  overflow-x:auto;
  gap:6px;
  padding:11px 14px;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none;}
.nav-indicator{
  position:absolute; top:6px; bottom:6px; right:0;
  background:linear-gradient(135deg,var(--tomato),var(--tomato-dark));
  border-radius:999px;
  box-shadow:0 4px 12px rgba(200,30,44,.5);
  transition:transform .38s var(--ease), width .38s var(--ease);
  z-index:0;
  pointer-events:none;
}
.nav button{
  position:relative; z-index:1;
  flex:0 0 auto;
  background:transparent;
  border:1.5px solid rgba(243,205,128,.35);
  color:var(--paper);
  padding:8px 16px;
  border-radius:999px;
  font-family:'Tajawal',sans-serif;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
  transition:color .25s, border-color .25s;
}
.nav button.active{border-color:transparent; color:#fff;}
.nav button:hover{border-color:var(--gold);}

/* ===== Sections ===== */
main{max-width:880px; margin:0 auto; padding:30px 14px 70px;}
section{margin-top:48px; scroll-margin-top:64px; position:relative;}
.reveal{opacity:0; transform:translateY(22px); transition:opacity .7s var(--ease), transform .7s var(--ease);}
.reveal.show{opacity:1; transform:translateY(0);}

.section-photo-wrap{position:relative; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); margin-bottom:-30px;}
.section-photo{
  width:100%; height:160px; object-fit:cover; display:block;
  transform:scale(1.01);
  transition:transform .6s var(--ease);
}
.section-photo-wrap:hover .section-photo{transform:scale(1.07);}
.section-photo-wrap::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(0deg, rgba(27,14,8,.55), transparent 55%);
}
.section-icon-watermark{
  position:absolute; left:8px; bottom:-14px; z-index:2;
  width:48px; height:48px;
  color:var(--gold);
  background:var(--char);
  border:3px solid var(--gold);
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow);
}
.section-icon-watermark svg{width:22px; height:22px;}

.section-banner-wrap{
  position:relative;
  display:flex;
  justify-content:flex-end;
  padding-inline-end:6px;
}
.section-banner{
  display:inline-flex; align-items:center; gap:8px;
  background:linear-gradient(135deg,var(--tomato),var(--tomato-dark));
  color:#fff;
  font-family:'Lalezar',sans-serif;
  font-size:25px;
  padding:9px 26px 9px 36px;
  border-radius:6px 22px 6px 22px;
  position:relative;
  box-shadow:0 5px 0 var(--maroon), var(--shadow);
  margin-bottom:8px;
}
.section-banner svg{width:20px; height:20px; flex:0 0 auto;}
.section-note, .fasting-note{
  text-align:center;
  background:linear-gradient(135deg,var(--basil),#1f5d39);
  color:#fff;
  font-weight:800;
  font-size:13.5px;
  padding:8px 14px;
  border-radius:10px;
  margin:14px 0;
  box-shadow:0 4px 12px rgba(47,122,79,.3);
}
.size-legend{
  display:flex;
  gap:8px;
  margin:10px 0 14px;
  justify-content:flex-end;
}
.size-legend span{
  background:var(--char);
  color:var(--gold-soft);
  font-weight:800;
  font-size:12.5px;
  padding:4px 13px;
  border-radius:7px;
  min-width:34px;
  text-align:center;
  border:1px solid rgba(226,163,61,.4);
}

.item-list{background:var(--paper); border-radius:16px; box-shadow:var(--shadow); padding:4px 14px; overflow:hidden;}
.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:13px 4px;
  border-bottom:1.5px dashed rgba(74,11,22,.18);
  transition:background .25s;
  border-radius:10px;
}
.item:last-child{border-bottom:none;}
@media (hover:hover){
  .item:hover{background:rgba(200,30,44,.05);}
  .item:hover .price-pill{transform:scale(1.05);}
}
.item-info{flex:1; min-width:0;}
.item-name{
  font-weight:800;
  font-size:16.5px;
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.new-tag{
  background:linear-gradient(135deg,var(--gold),#c9852a);
  color:var(--char);
  font-size:10px;
  font-weight:900;
  padding:2px 9px;
  border-radius:999px;
  transform:translateY(-1px);
  box-shadow:0 2px 6px rgba(226,163,61,.4);
}
.item-desc{
  font-size:12.5px;
  color:#6b4a30;
  margin-top:3px;
  line-height:1.5;
}
.prices{
  display:flex;
  gap:6px;
  flex:0 0 auto;
}
.price-pill{
  background:linear-gradient(160deg,var(--tomato),var(--tomato-dark));
  color:#fff;
  font-weight:800;
  font-size:14.5px;
  min-width:44px;
  text-align:center;
  padding:7px 4px;
  border-radius:999px;
  box-shadow:0 3px 0 var(--maroon);
  transition:transform .2s var(--ease);
}
.price-pill.empty{
  background:transparent;
  box-shadow:none;
  color:rgba(74,11,22,.25);
}

/* Addons */
.addon-card{
  background:var(--paper);
  border:1.5px solid rgba(74,11,22,.15);
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.addon-title{
  font-family:'Lalezar',sans-serif;
  font-size:19px;
  color:var(--maroon);
  margin:0 0 10px;
  display:flex; align-items:center; gap:8px;
}
.addon-title svg{width:18px; height:18px; color:var(--tomato);}
.addon-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 0;
  font-size:14.5px;
  border-bottom:1px dashed rgba(74,11,22,.13);
}
.addon-row:last-child{border-bottom:none;}
.addon-row .v{font-weight:800; color:var(--tomato-dark);}

/* Footer */
footer{
  background:radial-gradient(circle at 30% 0%, var(--maroon-light), var(--maroon) 55%, var(--char) 100%);
  color:var(--paper);
  text-align:center;
  padding:46px 20px 30px;
  margin-top:20px;
  border-top:6px solid var(--gold);
  position:relative;
}
.footer-badge{

const CONTACTS = ["01064023302","01021166148","01274282676","01005679741","0482050083"];

const SECTION_ICONS = {
  pizza:"ic-slice", fatayer:"ic-slice", helw:"ic-slice", toribido:"ic-slice",
  rolls:"ic-slice", pasta:"ic-slice", drinks:"ic-slice"
};

function priceCell(v){
  if(v===null || v===undefined) return '<span class="price-pill empty">—</span>';
  return `<span class="price-pill">${v}</span>`;
}

function renderNav(){
  const nav = document.getElementById('nav');
  const indicator = document.getElementById('navIndicator');
  const btnsHtml = DATA.map((s,i)=>`<button data-id="${s.id}" class="${i===0?'active':''}">${s.title}</button>`).join('')
    + `<button data-id="addons">الإضافات</button>`;
  nav.insertAdjacentHTML('beforeend', btnsHtml);
  nav.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById(btn.dataset.id);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  moveIndicator(nav.querySelector('button.active'));
}

function moveIndicator(btn){
  const nav = document.getElementById('nav');
  const indicator = document.getElementById('navIndicator');
  if(!btn || !indicator) return;
  const navRect = nav.getBoundingClientRect();
  const btnRect = btn.getBoundingClientRect();
  const right = navRect.right - btnRect.right + nav.scrollLeft;
  indicator.style.width = btnRect.width + 'px';
  indicator.style.transform = `translateX(${-right}px)`;
}

function renderMain(){
  const main = document.getElementById('main');
  let html = '';
  DATA.forEach(sec=>{
    const icon = SECTION_ICONS[sec.id] || 'ic-slice';
    html += `<section id="${sec.id}" class="reveal">
      ${sec.img? `<div class="section-photo-wrap"><img class="section-photo" src="${sec.img}" alt="${sec.title}" loading="lazy"><span class="section-icon-watermark"><svg class="slice-ic"><use href="#${icon}"/></svg></span></div>`:''}
      <div class="section-banner-wrap"><div class="section-banner"><svg class="slice-ic"><use href="#${icon}"/></svg>${sec.title}</div></div>
      ${sec.note? `<div class="fasting-note">${sec.note}</div>`:''}
      ${sec.sizes.length? `<div class="size-legend">${sec.sizes.map(s=>`<span>${s}</span>`).join('')}</div>` : ''}
      <div class="item-list">
      ${sec.items.map(it=>`
        <div class="item">
          <div class="item-info">
            <div class="item-name">${it.n} ${it.new?'<span class="new-tag">جديد</span>':''}</div>
            ${it.desc? `<div class="item-desc">${it.desc}</div>`:''}
          </div>
          <div class="prices">${it.p.map(p=> typeof p==='string'? `<span class="price-pill">${p}</span>` : priceCell(p)).join('')}</div>
        </div>
      `).join('')}
      </div>
    </section>`;
  });

  html += `<section id="addons" class="reveal">
    <div class="section-banner-wrap"><div class="section-banner"><svg class="slice-ic"><use href="#ic-slice"/></svg>الإضافات</div></div>
    ${ADDONS.map(card=>`
      <div class="addon-card">
        <p class="addon-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>${card.title}</p>
        ${card.rows.map(r=>`
          <div class="addon-row"><span>${r.n}</span><span class="v">${r.v}</span></div>
        `).join('')}
      </div>
    `).join('')}
  </section>`;

  main.innerHTML = html;
}

function renderFooter(){
  const list = document.getElementById('contactList');
  list.innerHTML = CONTACTS.map(n=>`<li><a href="tel:${n}"><svg class="slice-ic"><use href="#ic-phone"/></svg> ${n}</a></li>`).join('');
}

function setupScrollSpy(){
  const sections = [...DATA.map(s=>s.id), 'addons'];
  const navBtns = document.querySelectorAll('.nav button');
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        navBtns.forEach(b=>b.classList.remove('active'));
        const btn = document.querySelector(`.nav button[data-id="${entry.target.id}"]`);
        if(btn){
          btn.classList.add('active');
          moveIndicator(btn);
        }
      }
    });
  }, {rootMargin:'-100px 0px -70% 0px'});
  sections.forEach(id=>{
    const el = document.getElementById(id);
    if(el) observer.observe(el);
  });
}

function setupReveal(){
  const items = document.querySelectorAll('.reveal');
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('show');
        obs.unobserve(e.target);
      }
    });
  }, {threshold:.08, rootMargin:'0px 0px -8% 0px'});
  items.forEach(el=>obs.observe(el));
}

function setupFabTop(){
  const fab = document.getElementById('fabTop');
  window.addEventListener('scroll', ()=>{
    if(window.scrollY > 600) fab.classList.add('show');
    else fab.classList.remove('show');
  }, {passive:true});
  fab.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));
}

renderMain();
renderFooter();
setupScrollSpy();
setupReveal();
setupFabTop();
window.addEventListener('resize', ()=>{
  const active = document.querySelector('.nav button.active');
  if(active) moveIndicator(active);
});
