<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Calendar Builder — مصنع المحتوى</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

:root {
  --bg: #07070f;
  --s1: #0e0e1a;
  --s2: #141422;
  --s3: #1a1a2e;
  --border: #22223a;
  --gold: #c9a84c;
  --gold2: #f0d070;
  --text: #ede8dc;
  --muted: #5a5878;
  --green: #22c55e;
  --blue: #3b82f6;
  --purple: #a855f7;
  --pink: #ec4899;
  --orange: #f97316;
  --red: #ef4444;
  --cyan: #06b6d4;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

body::before {
  content:''; position:fixed; top:-100px; left:50%; transform:translateX(-50%);
  width:900px; height:500px;
  background: radial-gradient(ellipse, rgba(201,168,76,.06) 0%, transparent 65%);
  pointer-events:none; z-index:0;
}

.app { display:flex; min-height:100vh; position:relative; z-index:1; }

/* ── SIDEBAR ── */
.sidebar {
  width:320px; background:var(--s1); border-left:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:hidden;
  flex-shrink:0;
}
.sidebar-header {
  padding:24px 20px 16px;
  border-bottom:1px solid var(--border);
}
.logo-row { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.logo-icon { font-size:22px; }
.logo-text { font-size:16px; font-weight:900; color:var(--gold); }
.logo-sub { font-size:11px; color:var(--muted); }

.products-list {
  flex:1; overflow-y:auto; padding:12px;
}
.products-list::-webkit-scrollbar { width:4px; }
.products-list::-webkit-scrollbar-track { background:transparent; }
.products-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.product-item {
  background:var(--s2); border:1px solid var(--border); border-radius:10px;
  padding:12px 14px; margin-bottom:8px; cursor:pointer;
  transition:border-color .2s, transform .15s;
  position:relative;
}
.product-item:hover { border-color:rgba(201,168,76,.4); transform:translateX(-2px); }
.product-item.active { border-color:var(--gold); }
.product-item.active::before {
  content:''; position:absolute; right:0; top:0; bottom:0; width:3px;
  background:var(--gold); border-radius:0 10px 10px 0;
}
.pi-name { font-size:13px; font-weight:700; margin-bottom:4px; line-height:1.3; }
.pi-problem { font-size:11px; color:var(--muted); }
.pi-type {
  display:inline-block; margin-top:6px; padding:2px 8px; border-radius:10px;
  font-size:9px; font-weight:700; background:rgba(201,168,76,.1); color:var(--gold);
}
.pi-delete {
  position:absolute; top:8px; left:10px; background:none; border:none;
  color:var(--muted); cursor:pointer; font-size:14px; padding:2px;
  transition:color .2s;
}
.pi-delete:hover { color:var(--red); }

.add-product-btn {
  margin:12px; padding:12px; border:1px dashed var(--border); border-radius:10px;
  background:transparent; color:var(--muted); font-family:'Cairo',sans-serif;
  font-size:13px; font-weight:700; cursor:pointer; transition:all .2s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.add-product-btn:hover { border-color:var(--gold); color:var(--gold); }

/* ── MAIN ── */
.main { flex:1; overflow-y:auto; min-width:0; }

/* ── ADD PRODUCT MODAL ── */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.7);
  z-index:100; align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.open { display:flex; }
.modal {
  background:var(--s1); border:1px solid var(--border); border-radius:20px;
  padding:32px; width:100%; max-width:500px;
  animation:fadeUp .3s ease;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.modal h3 { font-size:20px; font-weight:900; margin-bottom:6px; }
.modal p { font-size:13px; color:var(--muted); margin-bottom:24px; }

.field { margin-bottom:16px; }
.field label { display:block; font-size:11px; font-weight:700; color:var(--gold); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:7px; }
.field input, .field select, .field textarea {
  width:100%; background:var(--s2); border:1px solid var(--border); border-radius:10px;
  padding:11px 14px; color:var(--text); font-family:'Cairo',sans-serif; font-size:14px;
  outline:none; transition:border-color .2s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color:var(--gold); }
.field textarea { resize:vertical; min-height:70px; }
.field select option { background:var(--s2); }

.modal-btns { display:flex; gap:10px; margin-top:20px; }
.btn-primary {
  flex:1; padding:12px; border:none; border-radius:10px;
  background:linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000; font-family:'Cairo',sans-serif; font-size:15px; font-weight:900;
  cursor:pointer; transition:transform .15s, box-shadow .15s;
}
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(201,168,76,.35); }
.btn-secondary {
  padding:12px 20px; border:1px solid var(--border); border-radius:10px;
  background:transparent; color:var(--muted); font-family:'Cairo',sans-serif;
  font-size:14px; cursor:pointer; transition:all .2s;
}
.btn-secondary:hover { border-color:var(--text); color:var(--text); }

/* ── EMPTY STATE ── */
.empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:40px; text-align:center;
}
.empty-icon { font-size:64px; margin-bottom:20px; opacity:.4; }
.empty-state h2 { font-size:24px; font-weight:900; margin-bottom:8px; }
.empty-state p { color:var(--muted); font-size:14px; max-width:340px; line-height:1.8; margin-bottom:28px; }
.empty-start-btn {
  padding:14px 32px; border:none; border-radius:12px;
  background:linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000; font-family:'Cairo',sans-serif; font-size:16px; font-weight:900;
  cursor:pointer; transition:transform .15s;
}
.empty-start-btn:hover { transform:translateY(-2px); }

/* ── CALENDAR VIEW ── */
.calendar-wrap { padding:32px; }

.cal-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:28px; flex-wrap:wrap; gap:12px;
}
.cal-title { font-size:26px; font-weight:900; }
.cal-title span { color:var(--gold); }

.cal-controls { display:flex; gap:8px; flex-wrap:wrap; }
.control-btn {
  padding:8px 16px; border-radius:8px; border:1px solid var(--border);
  background:transparent; color:var(--muted); font-family:'Cairo',sans-serif;
  font-size:12px; font-weight:700; cursor:pointer; transition:all .2s;
}
.control-btn:hover, .control-btn.active { background:var(--gold); border-color:var(--gold); color:#000; }

/* Products summary */
.products-summary {
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px;
}
.prod-chip {
  display:flex; align-items:center; gap:6px; padding:6px 12px;
  border-radius:20px; border:1px solid; font-size:11px; font-weight:700;
  cursor:pointer; transition:opacity .2s;
}
.prod-chip.dimmed { opacity:.3; }

/* Calendar grid */
.week-label {
  font-size:10px; font-weight:700; letter-spacing:2px; color:var(--muted);
  text-transform:uppercase; margin-bottom:12px; margin-top:24px;
  display:flex; align-items:center; gap:8px;
}
.week-label::after { content:''; flex:1; height:1px; background:var(--border); }

.day-grid {
  display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:8px;
}
.day-header {
  text-align:center; font-size:10px; font-weight:700; color:var(--muted);
  padding:6px; letter-spacing:1px; text-transform:uppercase;
}

/* Day card */
.day-card {
  background:var(--s1); border:1px solid var(--border); border-radius:12px;
  min-height:110px; padding:10px; position:relative; overflow:hidden;
  transition:border-color .2s, transform .15s; cursor:pointer;
}
.day-card:hover { transform:translateY(-2px); border-color:rgba(201,168,76,.3); }
.day-card.has-content { border-color:rgba(201,168,76,.2); }

.day-num { font-size:11px; font-weight:700; color:var(--muted); margin-bottom:6px; }
.day-posts { display:flex; flex-direction:column; gap:4px; }

.day-post {
  border-radius:6px; padding:4px 7px; font-size:10px; font-weight:600;
  line-height:1.4; border-right:2px solid;
}

/* Content type colors */
.type-video { background:rgba(59,130,246,.1); border-color:var(--blue); color:#93c5fd; }
.type-post { background:rgba(168,85,247,.1); border-color:var(--purple); color:#d8b4fe; }
.type-story { background:rgba(236,72,153,.1); border-color:var(--pink); color:#f9a8d4; }
.type-reel { background:rgba(249,115,22,.1); border-color:var(--orange); color:#fdba74; }
.type-hook { background:rgba(201,168,76,.1); border-color:var(--gold); color:var(--gold2); }

.day-more {
  font-size:9px; color:var(--muted); margin-top:3px; font-weight:700;
}

/* ── DAY DETAIL PANEL ── */
.day-panel {
  display:none; position:fixed; top:0; left:0; bottom:0; width:420px;
  background:var(--s1); border-right:1px solid var(--border);
  z-index:50; overflow-y:auto; animation:slideRight .25s ease;
}
.day-panel.open { display:block; }
@keyframes slideRight { from{transform:translateX(-20px);opacity:0} to{transform:translateX(0);opacity:1} }

.panel-close {
  position:sticky; top:0; display:flex; align-items:center; justify-content:space-between;
  padding:16px 20px; background:var(--s1); border-bottom:1px solid var(--border); z-index:1;
}
.panel-close-btn {
  background:none; border:none; color:var(--muted); font-size:18px;
  cursor:pointer; transition:color .2s; padding:4px;
}
.panel-close-btn:hover { color:var(--text); }
.panel-date { font-size:14px; font-weight:700; }

.panel-body { padding:20px; }

.panel-product-badge {
  display:inline-flex; align-items:center; gap:6px; padding:5px 12px;
  border-radius:20px; font-size:11px; font-weight:700; margin-bottom:16px;
  border:1px solid;
}

.panel-content-item {
  background:var(--s2); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; margin-bottom:10px; transition:border-color .2s;
}
.panel-content-item:hover { border-color:rgba(201,168,76,.3); }

.pci-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.pci-type-badge { font-size:10px; font-weight:700; padding:3px 9px; border-radius:8px; }
.pci-product { font-size:10px; color:var(--muted); margin-right:auto; }

.pci-title { font-size:14px; font-weight:700; line-height:1.5; margin-bottom:6px; }
.pci-hook {
  font-size:12px; color:var(--gold2); padding:8px 10px;
  background:rgba(201,168,76,.06); border-radius:6px;
  border-right:2px solid var(--gold); margin-bottom:8px;
}
.pci-caption { font-size:12px; color:var(--muted); line-height:1.7; }
.pci-cta {
  margin-top:8px; font-size:11px; font-weight:700; color:var(--green);
  display:flex; align-items:center; gap:5px;
}

.copy-item-btn {
  width:100%; padding:8px; margin-top:8px; border:1px solid var(--border);
  border-radius:7px; background:transparent; color:var(--muted);
  font-family:'Cairo',sans-serif; font-size:11px; font-weight:700;
  cursor:pointer; transition:all .2s;
}
.copy-item-btn:hover { border-color:var(--gold); color:var(--gold); }

/* ── GENERATE BTN ── */
.generate-section {
  padding:28px 32px; border-top:1px solid var(--border);
  background:var(--s1); position:sticky; bottom:0;
}
.gen-btn {
  width:100%; padding:16px; border:none; border-radius:12px;
  background:linear-gradient(135deg, var(--gold), var(--gold2));
  color:#000; font-family:'Cairo',sans-serif; font-size:16px; font-weight:900;
  cursor:pointer; transition:transform .15s, box-shadow .15s;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
.gen-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(201,168,76,.4); }
.gen-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

/* Loading */
.loading-overlay {
  display:none; position:fixed; inset:0; background:rgba(7,7,15,.85);
  z-index:200; align-items:center; justify-content:center; flex-direction:column;
}
.loading-overlay.open { display:flex; }
.spinner { width:48px; height:48px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:20px; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { font-size:16px; font-weight:700; color:var(--gold); margin-bottom:8px; }
.loading-sub { font-size:13px; color:var(--muted); }

/* Stats strip */
.stats-strip {
  display:flex; gap:1px; background:var(--border); border-radius:12px;
  overflow:hidden; margin-bottom:24px;
}
.stat { flex:1; background:var(--s1); padding:14px 10px; text-align:center; }
.stat-n { font-size:20px; font-weight:900; color:var(--gold); }
.stat-l { font-size:9px; color:var(--muted); font-weight:700; letter-spacing:1px; }

/* Toast */
.toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
  background:var(--green); color:#000; padding:10px 22px; border-radius:30px;
  font-weight:700; font-size:13px; opacity:0; transition:opacity .3s;
  z-index:999; pointer-events:none; white-space:nowrap;
}
.toast.show { opacity:1; }

/* Legend */
.legend { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
.leg-item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); }
.leg-dot { width:8px; height:8px; border-radius:2px; }

@media(max-width:900px) {
  .sidebar { width:260px; }
  .day-grid { grid-template-columns:repeat(4,1fr); }
}
@media(max-width:650px) {
  .app { flex-direction:column; }
  .sidebar { width:100%; height:auto; position:relative; }
  .day-grid { grid-template-columns:repeat(3,1fr); }
  .day-panel { width:100%; }
}
</style>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-row">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Content Calendar</span>
      </div>
      <div class="logo-sub">مصنع محتوى منتجاتك الرقمية</div>
    </div>

    <div class="products-list" id="productsList">
      <!-- products rendered here -->
    </div>

    <button class="add-product-btn" onclick="openModal()">
      ＋ أضف منتج رقمي
    </button>

    <div class="generate-section">
      <button class="gen-btn" id="genBtn" onclick="generateCalendar()">
        ⚡ اصنع الـ Calendar
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="mainContent">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📦</div>
      <h2>أضف منتجاتك الرقمية</h2>
      <p>ضيف منتجاتك وأنا هبني لك Content Calendar كامل بمحتوى بيبيع كل منتج على حدة</p>
      <button class="empty-start-btn" onclick="openModal()">＋ ابدأ بمنتجك الأول</button>
    </div>
    <div id="calendarView" style="display:none;"></div>
  </main>

</div>

<!-- ADD PRODUCT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>➕ منتج رقمي جديد</h3>
    <p>أدخل بيانات المنتج وأنا هولد المحتوى اللي هيبيعه</p>

    <div class="field">
      <label>اسم المنتج</label>
      <input type="text" id="pName" placeholder="مثال: Craft Brand OS — دليل بناء البراند" />
    </div>
    <div class="field">
      <label>المشكلة اللي بيحلها</label>
      <input type="text" id="pProblem" placeholder="مثال: أصحاب الحرف مش قادرين يبنوا براند رقمي" />
    </div>
    <div class="field">
      <label>الجمهور المستهدف</label>
      <input type="text" id="pAudience" placeholder="مثال: حلاقين، نجارين، طباخين" />
    </div>
    <div class="field">
      <label>نوع المنتج</label>
      <select id="pType">
        <option value="PDF / دليل">📄 PDF / دليل</option>
        <option value="Template / قالب">📋 Template / قالب</option>
        <option value="نظام / System">⚙️ نظام / System</option>
        <option value="كورس">🎓 كورس</option>
        <option value="Checklist">✅ Checklist</option>
        <option value="Notion Dashboard">🗂️ Notion Dashboard</option>
        <option value="Prompt Pack">🤖 Prompt Pack</option>
      </select>
    </div>
    <div class="field">
      <label>الفائدة الرئيسية (النتيجة)</label>
      <input type="text" id="pBenefit" placeholder="مثال: يبنوا براند رقمي ويوصلوا لـ 1M متابع" />
    </div>
    <div class="modal-btns">
      <button class="btn-primary" onclick="addProduct()">✓ أضف المنتج</button>
      <button class="btn-secondary" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- DAY DETAIL PANEL -->
<div class="day-panel" id="dayPanel">
  <div class="panel-close">
    <div class="panel-date" id="panelDate"></div>
    <button class="panel-close-btn" onclick="closePanel()">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">🤖 جاري توليد المحتوى...</div>
  <div class="loading-sub" id="loadingSub">AI بيبني خطة محتوى مخصصة لكل منتج</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──
let products = [];
let calendarData = {}; // { "2025-W1-D1": [{...}] }
let visibleProducts = new Set();
let selectedDay = null;

const PRODUCT_COLORS = [
  { bg:'rgba(59,130,246,.15)', border:'#3b82f6', text:'#93c5fd', dot:'#3b82f6' },
  { bg:'rgba(168,85,247,.15)', border:'#a855f7', text:'#d8b4fe', dot:'#a855f7' },
  { bg:'rgba(236,72,153,.15)', border:'#ec4899', text:'#f9a8d4', dot:'#ec4899' },
  { bg:'rgba(249,115,22,.15)', border:'#f97316', text:'#fdba74', dot:'#f97316' },
  { bg:'rgba(34,197,94,.15)', border:'#22c55e', text:'#86efac', dot:'#22c55e' },
  { bg:'rgba(6,182,212,.15)', border:'#06b6d4', text:'#67e8f9', dot:'#06b6d4' },
];

const DAYS_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const CONTENT_TYPES = [
  { key:'video', label:'🎬 فيديو', cssClass:'type-video' },
  { key:'reel', label:'📱 Reel/Short', cssClass:'type-reel' },
  { key:'post', label:'📝 بوست', cssClass:'type-post' },
  { key:'story', label:'🎭 ستوري', cssClass:'type-story' },
  { key:'hook', label:'🔥 هوك', cssClass:'type-hook' },
];

// ── MODAL ──
function openModal() {
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  ['pName','pProblem','pAudience','pBenefit'].forEach(id => document.getElementById(id).value = '');
}

function addProduct() {
  const name    = document.getElementById('pName').value.trim();
  const problem = document.getElementById('pProblem').value.trim();
  const audience= document.getElementById('pAudience').value.trim();
  const type    = document.getElementById('pType').value;
  const benefit = document.getElementById('pBenefit').value.trim();

  if (!name || !problem) { showToast('⚠️ اكتب اسم المنتج والمشكلة!', '#ef4444'); return; }

  const id = 'p' + Date.now();
  const colorIdx = products.length % PRODUCT_COLORS.length;
  products.push({ id, name, problem, audience, type, benefit, colorIdx });
  visibleProducts.add(id);
  closeModal();
  renderSidebar();
  document.getElementById('emptyState').style.display = 'none';
}

function deleteProduct(id, e) {
  e.stopPropagation();
  products = products.filter(p => p.id !== id);
  visibleProducts.delete(id);
  // clear calendar data for this product
  for (const key in calendarData) {
    calendarData[key] = calendarData[key].filter(c => c.productId !== id);
  }
  renderSidebar();
  if (products.length === 0) {
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('calendarView').style.display = 'none';
  } else {
    renderCalendarUI();
  }
}

function renderSidebar() {
  const list = document.getElementById('productsList');
  if (products.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:12px;padding:20px;">لا توجد منتجات بعد</div>';
    return;
  }
  list.innerHTML = products.map(p => {
    const c = PRODUCT_COLORS[p.colorIdx];
    return `
      <div class="product-item" style="border-color:${c.border}22;" onclick="focusProduct('${p.id}')">
        <button class="pi-delete" onclick="deleteProduct('${p.id}', event)">✕</button>
        <div class="pi-name">${p.name}</div>
        <div class="pi-problem">${p.problem}</div>
        <span class="pi-type" style="background:${c.bg};color:${c.text};">${p.type}</span>
      </div>
    `;
  }).join('');
}

function focusProduct(id) {
  if (visibleProducts.has(id)) visibleProducts.delete(id);
  else visibleProducts.add(id);
  renderCalendarUI();
}

// ── GENERATE ──
async function generateCalendar() {
  if (products.length === 0) { showToast('⚠️ أضف منتجاً أولاً!', '#ef4444'); return; }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  showLoading('🤖 AI بيولد المحتوى...', `جاري بناء Calendar لـ ${products.length} منتج`);

  try {
    calendarData = {};
    // Generate content for each product
    for (let i = 0; i < products.length; i++) {
      const p = products[i];
      document.getElementById('loadingText').textContent = `⚡ منتج ${i+1}/${products.length}: ${p.name}`;

      const content = await generateProductContent(p);
      // Distribute content across 30 days
      distributeContent(p.id, content);
    }

    hideLoading();
    document.getElementById('calendarView').style.display = 'block';
    document.getElementById('emptyState').style.display = 'none';
    renderCalendarUI();
    showToast('✅ تم توليد الـ Calendar!', '#22c55e');
  } catch(err) {
    hideLoading();
    console.error(err);
    showToast('⚠️ حدث خطأ — جرب مرة تانية', '#ef4444');
  }
  btn.disabled = false;
}

function generateFallback(p) {
  const types = ['video','story','post','reel','story','video','post'];
  return Array.from({length:30}, (_,i) => ({
    day: i+1,
    type: types[i % types.length],
    title: i < 7 ? `تعرّف على مشكلة ${p.problem}` :
           i < 14 ? `الحل: ${p.name}` :
           i < 21 ? `لماذا ${p.name} مختلف` :
           `احصل على ${p.name} الآن`,
    hook: `هل تعاني من ${p.problem}؟`,
    caption: `${p.name} هو الحل الذي يحتاجه ${p.audience || 'الجميع'}. ${p.benefit || ''}`,
    cta: i < 21 ? '👆 شاهد المزيد' : '🔗 الرابط في البايو'
  }));
}

function distributeContent(productId, items) {
  items.forEach(item => {
    const key = `day-${item.day}`;
    if (!calendarData[key]) calendarData[key] = [];
    calendarData[key].push({ ...item, productId });
  });
}

// ── RENDER CALENDAR ──
function renderCalendarUI() {
  const view = document.getElementById('calendarView');

  const totalContent = Object.values(calendarData).flat().filter(c => visibleProducts.has(c.productId)).length;
  const videoCount = Object.values(calendarData).flat().filter(c => c.type === 'video' && visibleProducts.has(c.productId)).length;
  const postCount = Object.values(calendarData).flat().filter(c => c.type === 'post' && visibleProducts.has(c.productId)).length;

  let html = `
    <div class="calendar-wrap">
      <div class="cal-header">
        <div class="cal-title">Calendar <span>30 يوم</span></div>
        <div class="cal-controls">
          <button class="control-btn" onclick="copyAllContent()">📋 نسخ الكل</button>
          <button class="control-btn" onclick="generateCalendar()">🔄 تجديد</button>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stat"><div class="stat-n">${totalContent}</div><div class="stat-l">قطعة محتوى</div></div>
        <div class="stat"><div class="stat-n">${videoCount}</div><div class="stat-l">فيديو</div></div>
        <div class="stat"><div class="stat-n">${postCount}</div><div class="stat-l">بوست</div></div>
        <div class="stat"><div class="stat-n">${products.length}</div><div class="stat-l">منتج</div></div>
      </div>

      <div class="products-summary">
        ${products.map(p => {
          const c = PRODUCT_COLORS[p.colorIdx];
          const dimmed = !visibleProducts.has(p.id) ? 'dimmed' : '';
          return `<div class="prod-chip ${dimmed}" style="background:${c.bg};border-color:${c.border};color:${c.text};" onclick="focusProduct('${p.id}')">${p.name.substring(0,25)}${p.name.length>25?'...':''}</div>`;
        }).join('')}
      </div>

      <div class="legend">
        <div class="leg-item"><div class="leg-dot" style="background:#3b82f6;"></div>فيديو</div>
        <div class="leg-item"><div class="leg-dot" style="background:#f97316;"></div>Reel</div>
        <div class="leg-item"><div class="leg-dot" style="background:#a855f7;"></div>بوست</div>
        <div class="leg-item"><div class="leg-dot" style="background:#ec4899;"></div>ستوري</div>
        <div class="leg-item"><div class="leg-dot" style="background:var(--gold);"></div>هوك</div>
      </div>

      <div class="day-grid">
        ${DAYS_AR.map(d => `<div class="day-header">${d.substring(0,3)}</div>`).join('')}
      </div>
  `;

  // Render weeks
  const weeks = [[1,7],[8,14],[15,21],[22,30]];
  const weekLabels = ['الأسبوع الأول — تعريف بالمشكلة','الأسبوع الثاني — تقديم الحل','الأسبوع الثالث — بناء الثقة','الأسبوع الرابع — دفع للشراء'];

  weeks.forEach(([start, end], wi) => {
    html += `<div class="week-label">${weekLabels[wi]}</div><div class="day-grid">`;
    for (let d = start; d <= end; d++) {
      const key = `day-${d}`;
      const items = (calendarData[key] || []).filter(c => visibleProducts.has(c.productId));
      const hasContent = items.length > 0;

      html += `<div class="day-card ${hasContent ? 'has-content' : ''}" onclick="openDay(${d})">`;
      html += `<div class="day-num">يوم ${d}</div>`;
      if (hasContent) {
        html += `<div class="day-posts">`;
        const show = items.slice(0,3);
        show.forEach(item => {
          const typeInfo = CONTENT_TYPES.find(t => t.key === item.type) || CONTENT_TYPES[0];
          const prod = products.find(p => p.id === item.productId);
          const c = prod ? PRODUCT_COLORS[prod.colorIdx] : PRODUCT_COLORS[0];
          const shortTitle = item.title ? item.title.substring(0,28) + (item.title.length > 28 ? '...' : '') : '';
          html += `<div class="day-post ${typeInfo.cssClass}" style="border-color:${c.border};">${typeInfo.label.split(' ')[0]} ${shortTitle}</div>`;
        });
        if (items.length > 3) {
          html += `<div class="day-more">+${items.length - 3} محتوى</div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
    }
    // fill remaining cells
    const dayCount = end - start + 1;
    if (dayCount < 7) {
      for (let f = 0; f < 7 - dayCount; f++) {
        html += `<div class="day-card" style="opacity:.2;cursor:default;"></div>`;
      }
    }
    html += `</div>`;
  });

  html += `</div>`;
  view.innerHTML = html;
}

// ── DAY PANEL ──
function openDay(dayNum) {
  selectedDay = dayNum;
  const key = `day-${dayNum}`;
  const items = (calendarData[key] || []).filter(c => visibleProducts.has(c.productId));

  document.getElementById('panelDate').textContent = `يوم ${dayNum}`;

  if (items.length === 0) {
    document.getElementById('panelBody').innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--muted);">
        <div style="font-size:40px;margin-bottom:12px;">📭</div>
        <p>لا يوجد محتوى لهذا اليوم</p>
      </div>`;
  } else {
    document.getElementById('panelBody').innerHTML = items.map(item => {
      const typeInfo = CONTENT_TYPES.find(t => t.key === item.type) || CONTENT_TYPES[0];
      const prod = products.find(p => p.id === item.productId);
      const c = prod ? PRODUCT_COLORS[prod.colorIdx] : PRODUCT_COLORS[0];

      return `
        <div class="panel-product-badge" style="background:${c.bg};border-color:${c.border};color:${c.text};">
          ${prod ? prod.name.substring(0,30) : ''} — ${typeInfo.label}
        </div>
        <div class="panel-content-item">
          <div class="pci-header">
            <span class="pci-type-badge ${typeInfo.cssClass}">${typeInfo.label}</span>
          </div>
          <div class="pci-title">${item.title || ''}</div>
          ${item.hook ? `<div class="pci-hook">🔥 هوك: ${item.hook}</div>` : ''}
          ${item.caption ? `<div class="pci-caption">${item.caption}</div>` : ''}
          ${item.cta ? `<div class="pci-cta">📣 ${item.cta}</div>` : ''}
          <button class="copy-item-btn" onclick="copyItem(${JSON.stringify(item).replace(/"/g,'&quot;')})">📋 نسخ</button>
        </div>
      `;
    }).join('');
  }

  document.getElementById('dayPanel').classList.add('open');
}

function closePanel() {
  document.getElementById('dayPanel').classList.remove('open');
}

function copyItem(item) {
  const prod = products.find(p => p.id === item.productId);
  const text = `📦 ${prod?.name || ''}\n📅 يوم ${item.day} — ${item.type}\n\n📌 ${item.title}\n🔥 هوك: ${item.hook}\n\n${item.caption}\n\n📣 CTA: ${item.cta}`;
  navigator.clipboard.writeText(text).then(() => showToast('✅ تم النسخ!', '#22c55e'));
}

function copyAllContent() {
  let text = `📅 Content Calendar — 30 يوم\n${'='.repeat(40)}\n\n`;
  products.forEach(p => {
    text += `\n📦 ${p.name}\n${'-'.repeat(30)}\n`;
    for (let d = 1; d <= 30; d++) {
      const items = (calendarData[`day-${d}`] || []).filter(c => c.productId === p.id);
      items.forEach(item => {
        text += `\nيوم ${d} [${item.type}]: ${item.title}\nهوك: ${item.hook}\n${item.caption}\nCTA: ${item.cta}\n`;
      });
    }
  });
  navigator.clipboard.writeText(text).then(() => showToast('✅ تم نسخ الـ Calendar كاملاً!', '#22c55e'));
}

// ── LOADING ──
function showLoading(text, sub) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingSub').textContent = sub;
  document.getElementById('loadingOverlay').classList.add('open');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('open');
}

// ── TOAST ──
function showToast(msg, color='#22c55e') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color;
  t.style.color = color === '#22c55e' ? '#000' : '#fff';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// init
renderSidebar();
</script>
