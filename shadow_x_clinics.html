<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow X — قائمة العيادات</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0f0ff;
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .brand {
    font-size: 2.8rem;
    font-weight: 700;
    color: #7dd4fc;
    letter-spacing: 4px;
    text-shadow: 0 0 30px #38bdf840;
  }

  .brand span { color: #fff; }

  .subtitle {
    font-size: 1rem;
    color: #7dd4fc99;
    margin-top: 4px;
    letter-spacing: 2px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin: 1.5rem 0 2rem;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
    background: #0f1929;
    border: 1px solid #1e3a5f;
    border-radius: 12px;
    padding: 0.75rem 1.5rem;
  }

  .stat-num {
    font-size: 1.8rem;
    font-weight: 700;
    color: #7dd4fc;
  }

  .stat-label {
    font-size: 0.8rem;
    color: #7dd4fc80;
  }

  .search-box {
    display: flex;
    justify-content: center;
    margin-bottom: 1.5rem;
  }

  .search-box input {
    width: 100%;
    max-width: 500px;
    padding: 0.7rem 1.2rem;
    border-radius: 10px;
    border: 1px solid #1e3a5f;
    background: #0f1929;
    color: #e0f0ff;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    outline: none;
  }

  .search-box input:focus {
    border-color: #38bdf8;
  }

  .table-wrap {
    overflow-x: auto;
    border-radius: 14px;
    border: 1px solid #1e3a5f;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
  }

  thead tr {
    background: #0f1929;
  }

  th {
    padding: 1rem 1.2rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #38bdf8;
    text-align: right;
    border-bottom: 1px solid #1e3a5f;
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid #111827;
    transition: background 0.15s;
  }

  tbody tr:hover {
    background: #0f1929;
  }

  tbody tr:last-child { border-bottom: none; }

  td {
    padding: 0.85rem 1.2rem;
    font-size: 0.9rem;
    color: #cbd5e1;
    vertical-align: middle;
  }

  .num-badge {
    background: #0f1929;
    color: #7dd4fc;
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    padding: 2px 10px;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .spec-badge {
    background: #0a1628;
    color: #93c5fd;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .phone-text {
    color: #7dd4fc;
    font-weight: 600;
    font-size: 0.92rem;
    direction: ltr;
    text-align: left;
    display: block;
  }

  .no-phone {
    color: #374151;
    font-size: 0.82rem;
  }

  .wa-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #064e3b;
    color: #6ee7b7;
    border: 1px solid #065f46;
    border-radius: 8px;
    padding: 6px 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .wa-btn:hover {
    background: #065f46;
    color: #a7f3d0;
  }

  .wa-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    flex-shrink: 0;
  }

  .no-btn {
    color: #374151;
    font-size: 0.82rem;
  }

  .footer {
    text-align: center;
    margin-top: 2.5rem;
    color: #1e3a5f;
    font-size: 0.82rem;
  }

  .footer span { color: #38bdf860; }

  @media (max-width: 600px) {
    .brand { font-size: 2rem; }
    th, td { padding: 0.7rem 0.8rem; }
  }
</style>
</head>

function formatPhone(p) {
  if (!p) return null;
  let clean = p.replace(/\D/g, '');
  if (clean.startsWith('0') && clean.length === 11) return '2' + clean;
  if (clean.startsWith('20')) return clean;
  return '20' + clean;
}

function buildTable(data) {

function filterTable() {

  const filtered = clinics.filter(c =>
    c.name.toLowerCase().includes(q) || c.spec.toLowerCase().includes(q)
  );
  buildTable(filtered);
}
